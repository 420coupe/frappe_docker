# portainer-stack.yml
# ERPNext production stack for Portainer Git deployment.
#
# Database : External Supabase PostgreSQL (session pooler, no local db container)
# Proxy    : Nginx Proxy Manager — frontend joins npmnetwork so NPM can
#            reach frontend:8080 by container name without exposing host ports.
# Redis    : Two local containers (cache + persistent queue)
# Multi-site: FRAPPE_SITE_NAME_HEADER=$$host routes each domain to its own
#            ERPNext site — add a Proxy Host in NPM per corporation domain.
#
# ── Required variables (set in Portainer > Stack > Environment variables) ────
#
#   ERPNEXT_VERSION   ERPNext release tag, e.g. v16.16.0
#   DB_HOST           Supabase session pooler host
#                     e.g. aws-0-us-east-1.pooler.supabase.com
#                     Use the SESSION pooler (port 5432), NOT the transaction
#                     pooler (port 6543) — Frappe uses persistent connections.
#   DB_PASSWORD       Supabase "postgres" role password
#
# ── Optional variables ────────────────────────────────────────────────────────
#
#   DB_PORT                  5432 (default)
#   DB_SSL_MODE              require (default — Supabase enforces SSL)
#   FRAPPE_SITE_NAME_HEADER  $$host (default — route by HTTP Host header)
#   UPSTREAM_REAL_IP_ADDRESS 172.18.0.0/16 (NPM network subnet — set so
#                            ERPNext sees real client IPs not NPM container IP)
#   UPSTREAM_REAL_IP_HEADER  X-Forwarded-For (default)
#   UPSTREAM_REAL_IP_RECURSIVE off (default)
#   PROXY_READ_TIMEOUT       120 (seconds, increase for slow reports)
#   CLIENT_MAX_BODY_SIZE     50m (increase for large file uploads)
#   RESTART_POLICY           unless-stopped (default)
#   CUSTOM_IMAGE             frappe/erpnext (default, override for custom builds)
#   CUSTOM_TAG               (defaults to ERPNEXT_VERSION)
#   NPM_NETWORK              nginxproxymanager_default (default)
#
# ── Site creation (run once per corporation after first deploy) ───────────────
#
#   docker exec -it erpnext-backend-1 bash
#
#   bench new-site \
#     --db-type postgres \
#     --db-root-username postgres.<project-ref> \
#     --db-root-password "$DB_PASSWORD" \
#     --db-user postgres.<project-ref> \
#     --db-password "$DB_PASSWORD" \
#     --admin-password <your-admin-password> \
#     --install-app erpnext \
#     corp1.yourdomain.com
#
#   Then in NPM: add Proxy Host corp1.yourdomain.com → frontend:8080
#   Enable "Websockets Support" in NPM for real-time features.
# ─────────────────────────────────────────────────────────────────────────────

x-image: &image
  build:
    context: .
    dockerfile: Dockerfile
    args:
      ERPNEXT_VERSION: ${ERPNEXT_VERSION}
  image: ${CUSTOM_IMAGE:-frappe/erpnext}:${CUSTOM_TAG:-$ERPNEXT_VERSION}
  pull_policy: build
  restart: ${RESTART_POLICY:-unless-stopped}

# PGSSLMODE is read by psycopg2/libpq on every postgres connection.
# "require" is mandatory for Supabase. Set DB_SSL_MODE=prefer to disable
# for non-SSL postgres instances.
x-db-ssl: &db_ssl
  PGSSLMODE: ${DB_SSL_MODE:-require}

# Supabase PostgreSQL compatibility patches.
# These files override Frappe source to fix issues with the session pooler:
#   setup_db.py — fixes cur_db_name, ALTER DATABASE OWNER TO, and psql bootstrap
#   goal.py     — fixes AmbiguousFunction: sum(unknown) on PG dashboard widgets
# Scoped to v16.16.0. Re-copy from container if ERPNEXT_VERSION is bumped:
#   docker cp erpnext-backend-1:/home/frappe/frappe-bench/apps/frappe/frappe/database/postgres/setup_db.py patches/frappe/database/postgres/setup_db.py
#   docker cp erpnext-backend-1:/home/frappe/frappe-bench/apps/frappe/frappe/utils/goal.py patches/frappe/utils/goal.py

x-backend-defaults: &backend_defaults
  <<: *image
  environment:
    <<: *db_ssl
  volumes:
    - sites:/home/frappe/frappe-bench/sites
  depends_on:
    configurator:
      condition: service_completed_successfully

services:
  # ── Configurator ────────────────────────────────────────────────────────────
  # Runs once at startup to write common_site_config.json.
  # All other services wait for this to exit 0 before starting.
  configurator:
    <<: *image
    entrypoint:
      - bash
      - -c
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://redis-cache:6379";
        bench set-config -g redis_queue "redis://redis-queue:6379";
        bench set-config -g redis_socketio "redis://redis-queue:6379";
        bench set-config -gp socketio_port 9000;
        bench set-config -g chromium_path /usr/bin/chromium-headless-shell;
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT:-5432}
    depends_on:
      - redis-cache
      - redis-queue
    restart: on-failure
    volumes:
      - sites:/home/frappe/frappe-bench/sites

  # ── Application backend (Gunicorn on :8000) ─────────────────────────────────
  backend:
    <<: *backend_defaults

  # ── Nginx frontend proxy (:8080) ─────────────────────────────────────────────
  # Joins the NPM network so NPM can reach it by container name (frontend:8080).
  # Does NOT expose any host port — all external traffic goes through NPM.
  frontend:
    <<: *image
    command:
      - nginx-entrypoint.sh
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${FRAPPE_SITE_NAME_HEADER:-$$host}
      UPSTREAM_REAL_IP_ADDRESS: ${UPSTREAM_REAL_IP_ADDRESS:-127.0.0.1}
      UPSTREAM_REAL_IP_HEADER: ${UPSTREAM_REAL_IP_HEADER:-X-Forwarded-For}
      UPSTREAM_REAL_IP_RECURSIVE: ${UPSTREAM_REAL_IP_RECURSIVE:-off}
      PROXY_READ_TIMEOUT: ${PROXY_READ_TIMEOUT:-120}
      CLIENT_MAX_BODY_SIZE: ${CLIENT_MAX_BODY_SIZE:-50m}
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      - backend
      - websocket
    networks:
      - default
      - npmnetwork

  # ── WebSocket / Socket.IO (:9000) ────────────────────────────────────────────
  websocket:
    <<: *image
    command:
      - node
      - /home/frappe/frappe-bench/apps/frappe/socketio.js
    volumes:
      - sites:/home/frappe/frappe-bench/sites
    depends_on:
      configurator:
        condition: service_completed_successfully

  # ── Background workers ────────────────────────────────────────────────────────
  queue-short:
    <<: *backend_defaults
    command: bench worker --queue short,default

  queue-long:
    <<: *backend_defaults
    command: bench worker --queue long,default,short

  # ── Scheduler ────────────────────────────────────────────────────────────────
  scheduler:
    <<: *backend_defaults
    command: bench schedule

  # ── Redis ─────────────────────────────────────────────────────────────────────
  # Two separate instances: one for in-memory cache (no persistence),
  # one for the background job queue (persisted to redis-queue-data volume).
  redis-cache:
    image: redis:8.6-alpine
    restart: unless-stopped

  redis-queue:
    image: redis:8.6-alpine
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data

volumes:
  sites:
  redis-queue-data:

networks:
  # npmnetwork joins this stack to the pre-existing Nginx Proxy Manager network.
  # NPM must already be running before this stack is deployed.
  npmnetwork:
    name: ${NPM_NETWORK:-nginxproxymanager_default}
    external: true
